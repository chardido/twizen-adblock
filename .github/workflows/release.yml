name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm test
      - run: npm run build

      - name: Check that the tag matches the extension version
        run: |
          version="$(node -p "require('./package.json').version")"
          tag="${GITHUB_REF_NAME#v}"
          if [ "$version" != "$tag" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match the extension version ${version} in package.json"
            exit 1
          fi
          echo "VERSION=${version}" >> "$GITHUB_ENV"

      - name: Package
        run: |
          for browser in chrome firefox; do
            (cd "extension/dist/${browser}" && zip -X -r "${GITHUB_WORKSPACE}/twizen-adblock-${browser}-v${VERSION}.zip" .)
          done

      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cat > notes.md <<'NOTES'
          Chrome: unzip the Chrome archive, keep the folder, then open `chrome://extensions`, enable Developer mode and use "Load unpacked". Updates are manual: when a newer release exists the extension shows a badge on its toolbar icon, and clicking the icon opens the release page.

          Firefox: if a `.xpi` file is listed among the assets, it was signed by Mozilla (a separate job adds it after this release is published): open it in Firefox, or drag it onto a Firefox window, to install it. A signed add-on then updates itself. If there is no `.xpi`, use the Firefox zip, which is unsigned and can only be loaded as a temporary add-on (`about:debugging#/runtime/this-firefox`, "Load Temporary Add-on"); it is removed when Firefox restarts and never updates.

          See the README for details and known limits.
          NOTES
          gh release create "${GITHUB_REF_NAME}" \
            "twizen-adblock-chrome-v${VERSION}.zip" \
            "twizen-adblock-firefox-v${VERSION}.zip" \
            --title "${GITHUB_REF_NAME}" \
            --notes-file notes.md

  # Firma Mozilla (canale unlisted, auto-distribuzione). Job separato: se fallisce, zip e Release restano pubblicati.
  sign-firefox:
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Check the signing configuration
        id: cfg
        env:
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -z "$AMO_JWT_ISSUER" ] || [ -z "$AMO_JWT_SECRET" ]; then
            echo "::notice::AMO_JWT_ISSUER / AMO_JWT_SECRET are not configured: skipping the Mozilla signing (forks, or secrets not set)."
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "finalize=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if gh release view "${GITHUB_REF_NAME}" --json assets --jq '.assets[].name' | grep -q '\.xpi$'; then
            # Mozilla firma una versione una sola volta: niente da firmare, ma la pulizia va rifatta (un run precedente puo' essere morto dopo l'upload)
            echo "::notice::The release already has a signed .xpi: not signing again, only making sure the release is in its final state."
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "finalize=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "run=true" >> "$GITHUB_OUTPUT"
          echo "finalize=false" >> "$GITHUB_OUTPUT"

      - name: Take the released Firefox build
        if: steps.cfg.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # si firma lo stesso contenuto dello zip pubblicato (web-ext sign ricrea l'archivio da una cartella: i byte dello zip cambiano, i file no)
          gh release download "${GITHUB_REF_NAME}" --pattern 'twizen-adblock-firefox-v*.zip' --dir released
          mkdir firefox-build
          unzip -q released/twizen-adblock-firefox-v*.zip -d firefox-build
          # Mozilla richiede il sorgente del codice generato dal build: archivio del tag (README con le istruzioni, lockfile incluso)
          git archive --format=zip --output=source.zip HEAD

      - name: Sign with Mozilla
        if: steps.cfg.outputs.run == 'true'
        env:
          WEB_EXT_API_KEY: ${{ secrets.AMO_JWT_ISSUER }}
          WEB_EXT_API_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: |
          # --approval-timeout: attesa della revisione automatica (ms). Se scade il job fallisce, ma la versione resta registrata
          # presso Mozilla: il .xpi firmato si scarica dal Developer Hub e si aggiunge alla Release con `gh release upload`.
          npx --yes web-ext@10.8.0 sign \
            --source-dir firefox-build \
            --channel unlisted \
            --artifacts-dir signed \
            --upload-source-code source.zip \
            --approval-timeout 2400000
          test "$(find signed -name '*.xpi' | wc -l)" -eq 1

      - name: Check that the signed file contains the released files
        if: steps.cfg.outputs.run == 'true'
        run: |
          xpi="$(find signed -name '*.xpi')"
          mkdir signed-x
          unzip -q "$xpi" -d signed-x
          # il manifest firmato puo' differire solo per le firme (META-INF): script e icona devono essere identici
          for f in twizen-adblock.js icon.png; do
            cmp "firefox-build/$f" "signed-x/$f"
          done

      - name: Attach the signed file to the release
        id: attach
        if: steps.cfg.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          cp "$(find signed -name '*.xpi')" "twizen-adblock-firefox-v${version}.xpi"
          gh release upload "${GITHUB_REF_NAME}" "twizen-adblock-firefox-v${version}.xpi"

      # Manifest degli aggiornamenti di Firefox (update_url del manifest). Si ricalcola dal .xpi che e' davvero sulla Release, quindi
      # l'hash e' quello dei byte che Firefox scarichera'. Gira anche in finalize: se un run precedente e' morto prima dell'upload, lo ripara.
      # Va PRIMA della pulizia: se la pulizia fallisce, gli aggiornamenti funzionano comunque. Se manca (firma fallita), "latest" da' 404:
      # Firefox lo registra e riprova al controllo successivo, nessun effetto per l'utente.
      - name: Publish the Firefox update manifest
        if: steps.cfg.outputs.finalize == 'true' || steps.attach.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          xpi="twizen-adblock-firefox-v${version}.xpi"
          if ! gh release view "${GITHUB_REF_NAME}" --json assets --jq '.assets[].name' | grep -qx "$xpi"; then
            echo "::error::${xpi} is not on the release: not publishing the update manifest."
            exit 1
          fi
          gh release download "${GITHUB_REF_NAME}" --pattern "$xpi" --dir published
          hash="$(sha256sum "published/${xpi}" | cut -d' ' -f1)"
          mkdir -p manifest
          jq -n --arg id "twizen-adblock@chardido.github.io" --arg v "$version" \
            --arg link "https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/${xpi}" \
            --arg hash "sha256:${hash}" \
            '{addons: {($id): {updates: [{version: $v, update_link: $link, update_hash: $hash}]}}}' > manifest/updates.json
          # se la Release ha gia' lo stesso file non si tocca nulla (--clobber cancella prima di caricare)
          if gh release download "${GITHUB_REF_NAME}" --pattern updates.json --dir existing 2>/dev/null && cmp -s existing/updates.json manifest/updates.json; then
            echo "updates.json is already up to date."
            exit 0
          fi
          gh release upload "${GITHUB_REF_NAME}" manifest/updates.json --clobber

      # Con il .xpi firmato la Release offre un solo file per browser: via lo zip Firefox non firmato, note riscritte.
      # Ordine: prima lo zip, poi le note (se muore in mezzo le note originali restano vere: parlano dello zip solo "se non c'e' un .xpi").
      # Idempotente: gira anche quando il .xpi c'era gia' (vedi cfg) e non fa nulla se e' tutto gia' a posto.
      - name: Leave one file per browser on the release
        if: steps.cfg.outputs.finalize == 'true' || steps.attach.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          assets="$(gh release view "${GITHUB_REF_NAME}" --json assets --jq '.assets[].name')"
          # lo zip si cancella solo se il .xpi atteso e' davvero sulla Release
          if ! printf '%s\n' "$assets" | grep -qx "twizen-adblock-firefox-v${version}.xpi"; then
            echo "::error::twizen-adblock-firefox-v${version}.xpi is not on the release: leaving the Firefox zip in place."
            exit 1
          fi
          if printf '%s\n' "$assets" | grep -qx "twizen-adblock-firefox-v${version}.zip"; then
            gh release delete-asset "${GITHUB_REF_NAME}" "twizen-adblock-firefox-v${version}.zip" --yes
          fi
          cat > notes.md <<'NOTES'
          Chrome: unzip the Chrome archive, keep the folder, then open `chrome://extensions`, enable Developer mode and use "Load unpacked". Updates are manual: when a newer release exists the extension shows a badge on its toolbar icon, and clicking the icon opens the release page.

          Firefox: the `.xpi` is signed by Mozilla. Open it in Firefox, or drag it onto a Firefox window, and confirm the installation. It then updates itself (Firefox checks about once a day).

          See the README for details and known limits.
          NOTES
          gh release edit "${GITHUB_REF_NAME}" --notes-file notes.md
