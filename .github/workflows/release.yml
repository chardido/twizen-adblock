name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm test
      - run: npm run build

      - name: Check that the tag matches the extension version
        run: |
          version="$(node -p "require('./package.json').version")"
          tag="${GITHUB_REF_NAME#v}"
          if [ "$version" != "$tag" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match the extension version ${version} in package.json"
            exit 1
          fi
          echo "VERSION=${version}" >> "$GITHUB_ENV"

      - name: Package
        run: |
          for browser in chrome firefox; do
            (cd "extension/dist/${browser}" && zip -X -r "${GITHUB_WORKSPACE}/twizen-adblock-${browser}-v${VERSION}.zip" .)
          done

      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cat > notes.md <<'NOTES'
          Chrome: unzip the Chrome archive, keep the folder, then open `chrome://extensions`, enable Developer mode and use "Load unpacked". There are no automatic updates.

          Firefox: the Firefox archive is unsigned, so it can only be loaded as a temporary add-on (`about:debugging#/runtime/this-firefox`, "Load Temporary Add-on"). It is removed when Firefox restarts.

          See the README for details and known limits.
          NOTES
          gh release create "${GITHUB_REF_NAME}" \
            "twizen-adblock-chrome-v${VERSION}.zip" \
            "twizen-adblock-firefox-v${VERSION}.zip" \
            --title "${GITHUB_REF_NAME}" \
            --notes-file notes.md
